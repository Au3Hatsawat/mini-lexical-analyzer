[project]
name = "mini-lexer"
version = "0.1.0"
description = "Mini Lexical Analyzer built with SLY"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "sly>=0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
mini-lexer = "mini_lexer.main:main"